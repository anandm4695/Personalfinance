<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F1A" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
  <meta name="description" content="ArthaDrishti — Track your net worth, investments, expenses, credit cards, loans, taxes and financial goals in one place." />
  <meta name="keywords" content="arthadrishti, personal finance, net worth tracker, investment tracker, SIP, mutual funds, tax calculator, budget, India" />
  <meta name="author" content="Anand Mohta" />

  <!-- Open Graph -->
  <meta property="og:title" content="ArthaDrishti by Anand Mohta" />
  <meta property="og:description" content="Track your net worth, investments, expenses and financial goals — all in one secure place." />
  <meta property="og:type" content="website" />

  <!-- Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ArthaDrishti" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Prevent phone number detection -->
  <meta name="format-detection" content="telephone=no" />

  <title>ArthaDrishti by Anand Mohta</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=5" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Preconnect to Google Fonts for faster load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Critical fonts only — Inter + Outfit are used by the pre-login shell and default app theme,
       Fraunces is the display/headline serif used for section titles, hero figures and the
       brand wordmark. The other 6 sans families only back the authenticated Settings font-picker;
       loading them here would block first paint for every anonymous visitor to pay for a feature
       they can't reach yet. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,560;0,9..144,650;1,9..144,500&display=swap" rel="stylesheet" />

  <script>
    // Detect saved theme early to prevent flash of wrong theme
    (function() {
      var theme = 'dark';
      try { theme = localStorage.getItem('finance-theme') || 'dark'; } catch(e) {}
      var isDark = theme === 'dark';
      document.documentElement.style.setProperty('--init-bg', isDark ? '#0B0F1A' : '#F8FAFC');
      document.documentElement.style.setProperty('--init-color', isDark ? '#E2E8F0' : '#0F172A');
      if (isDark) document.documentElement.classList.add('dark-theme');
    })();
  </script>
  <style>
    /* Critical inline CSS — eliminates FOUC */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--init-bg, #0F0F1A);
      color: var(--init-color, #E8EAED);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { min-height: 100vh; }

    /* App loading shimmer shown before JS hydrates */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--init-bg, #0B0F1A);
      z-index: 9999;
      gap: 24px;
      transition: opacity 0.4s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    .loading-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: pulse-logo 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(197,161,82,0.4));
    }
    .loading-tagline {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(197,161,82,0.75);
    }
    .loading-bar {
      width: 180px;
      height: 3px;
      background: rgba(128,128,128,0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #C5A152, #E8C97A, #C5A152);
      background-size: 200%;
      border-radius: 2px;
      animation: shimmer 1.6s linear infinite;
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(197,161,82,0.35)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 36px rgba(197,161,82,0.55)); }
    }
    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
  </style>
</head>

<body>
  <!-- Splash screen — hidden once React mounts -->
  <div id="app-loading">
    <img src="/logo.png" alt="ArthaDrishti by Anand Mohta" class="loading-logo" />
    <div class="loading-tagline">Plan &bull; Grow &bull; Secure &bull; Prosper</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>

  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
    // Hide splash once React root renders
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const splash = document.getElementById('app-loading');
        if (splash) { splash.classList.add('hidden'); setTimeout(() => splash.remove(), 500); }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });

    // Lazy-load the remaining font-picker families (Settings > Appearance) after the app
    // is idle, so anonymous/login-screen visitors never pay for fonts they can't use yet.
    const loadDeferredFonts = () => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap';
      document.head.appendChild(link);
    };
    if ('requestIdleCallback' in window) {
      window.addEventListener('load', () => requestIdleCallback(loadDeferredFonts, { timeout: 4000 }));
    } else {
      window.addEventListener('load', () => setTimeout(loadDeferredFonts, 2000));
    }
  </script>

  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
