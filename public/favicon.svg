<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Gold border ring -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#C5A152" stroke-width="1.5" opacity="0.6"/>
  <!-- Trunk -->
  <line x1="32" y1="28" x2="32" y2="48" stroke="url(#trunk)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Branches -->
  <line x1="32" y1="34" x2="23" y2="27" stroke="#C5A152" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="41" y2="27" stroke="#C5A152" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Canopy - simplified layered circles -->
  <circle cx="32" cy="17" r="7" fill="url(#leaf)"/>
  <circle cx="24" cy="21" r="6" fill="#1B9E4B"/>
  <circle cx="40" cy="21" r="6" fill="#1B9E4B"/>
  <circle cx="21" cy="26" r="5" fill="#15803D"/>
  <circle cx="32" cy="23" r="6.5" fill="#1B9E4B"/>
  <circle cx="43" cy="26" r="5" fill="#15803D"/>
  <!-- Ground accent -->
  <ellipse cx="32" cy="49" rx="11" ry="2.5" fill="#15803D" opacity="0.5"/>
  <!-- Subtle gold coin accents on canopy -->
  <circle cx="28" cy="16" r="1.5" fill="#C5A152" opacity="0.7"/>
  <circle cx="36" cy="20" r="1.2" fill="#C5A152" opacity="0.6"/>
  <circle cx="24" cy="23" r="1" fill="#C5A152" opacity="0.5"/>
</svg>
