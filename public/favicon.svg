<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
  </defs>
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <!-- Gold circle border matching logo -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#C5A152" stroke-width="2"/>
  <!-- Trunk - gold, central -->
  <line x1="32" y1="30" x2="32" y2="50" stroke="#8B7332" stroke-width="3" stroke-linecap="round"/>
  <!-- Branch pair 1 (lowest) -->
  <line x1="32" y1="40" x2="22" y2="33" stroke="#8B7332" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="42" y2="33" stroke="#8B7332" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Branch pair 2 (middle) -->
  <line x1="32" y1="35" x2="20" y2="26" stroke="#8B7332" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="35" x2="44" y2="26" stroke="#8B7332" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Branch pair 3 (upper) -->
  <line x1="32" y1="30" x2="24" y2="20" stroke="#8B7332" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="40" y2="20" stroke="#8B7332" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Leaves - dark green individual ellipses matching logo style -->
  <!-- Top crown -->
  <ellipse cx="32" cy="12" rx="4" ry="3" fill="#1B5E3A"/>
  <ellipse cx="27" cy="14" rx="3.5" ry="2.8" fill="#1E6E42"/>
  <ellipse cx="37" cy="14" rx="3.5" ry="2.8" fill="#1E6E42"/>
  <!-- Upper layer -->
  <ellipse cx="22" cy="17" rx="3.5" ry="2.8" fill="#1B5E3A"/>
  <ellipse cx="32" cy="16" rx="4" ry="3" fill="#22734A"/>
  <ellipse cx="42" cy="17" rx="3.5" ry="2.8" fill="#1B5E3A"/>
  <!-- Middle layer -->
  <ellipse cx="18" cy="22" rx="3.2" ry="2.5" fill="#1E6E42"/>
  <ellipse cx="25" cy="21" rx="3.5" ry="2.8" fill="#22734A"/>
  <ellipse cx="32" cy="22" rx="3.5" ry="2.8" fill="#1B5E3A"/>
  <ellipse cx="39" cy="21" rx="3.5" ry="2.8" fill="#22734A"/>
  <ellipse cx="46" cy="22" rx="3.2" ry="2.5" fill="#1E6E42"/>
  <!-- Lower canopy layer -->
  <ellipse cx="20" cy="27" rx="3" ry="2.5" fill="#1B5E3A"/>
  <ellipse cx="27" cy="26" rx="3.2" ry="2.5" fill="#1E6E42"/>
  <ellipse cx="37" cy="26" rx="3.2" ry="2.5" fill="#1E6E42"/>
  <ellipse cx="44" cy="27" rx="3" ry="2.5" fill="#1B5E3A"/>
  <!-- Bottom canopy -->
  <ellipse cx="22" cy="31" rx="3" ry="2.2" fill="#22734A"/>
  <ellipse cx="42" cy="31" rx="3" ry="2.2" fill="#22734A"/>
  <!-- Gold/amber accent leaves (matching logo's golden leaves) -->
  <ellipse cx="29" cy="13" rx="2.5" ry="2" fill="#C5A152"/>
  <ellipse cx="36" cy="18" rx="2.2" ry="1.8" fill="#C5A152"/>
  <ellipse cx="23" cy="24" rx="2" ry="1.6" fill="#C5A152"/>
  <ellipse cx="41" cy="24" rx="2" ry="1.6" fill="#C5A152"/>
  <ellipse cx="32" cy="19" rx="2.2" ry="1.8" fill="#B8963E"/>
  <!-- Green grass base -->
  <ellipse cx="32" cy="51" rx="14" ry="4" fill="#1B5E3A"/>
</svg>
