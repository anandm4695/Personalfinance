name: Sync DB Schema

# Runs whenever a SQL migration file is added or changed on main.
# Applies fix_schema_sync.sql (idempotent) to the demo Supabase DB so
# it always has all tables and columns from the latest migrations.
#
# Required GitHub Secret (already configured):
#   SUPABASE_DB_URL — demo Supabase direct connection string

on:
  push:
    branches: [main]
    paths:
      - "database/**"

jobs:
  sync-schema:
    name: Apply schema to demo Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run schema sync
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f database/fix_schema_sync.sql
