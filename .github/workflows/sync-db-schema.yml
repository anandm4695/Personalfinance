name: Sync DB Schema

# Runs whenever a SQL migration file is added or changed on main.
# Applies fix_schema_sync.sql (idempotent) to the demo Supabase DB via
# the Supabase Management API over HTTPS — no direct TCP needed.
#
# Required GitHub Secret:
#   SUPABASE_ACCESS_TOKEN — Supabase personal access token
#                           supabase.com → Account → Access Tokens → Generate

on:
  push:
    branches: [main]
    paths:
      - "database/**"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  sync-schema:
    name: Apply schema to demo Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run schema sync via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SQL=$(cat database/fix_schema_sync.sql)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/fddxdufgntdemrvqgzuq/database/query" \
            --data-binary "{\"query\": $(echo "$SQL" | jq -Rs .)}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Migration failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Schema sync complete"
