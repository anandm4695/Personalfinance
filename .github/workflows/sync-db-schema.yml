name: Sync DB Schema

# Runs whenever a SQL migration file is added or changed on main.
# Applies fix_schema_sync.sql (idempotent) so the connected Supabase DB
# always has all tables and columns from the latest migrations.
#
# Required GitHub Secret:
#   SUPABASE_DB_URL — postgres connection string from Supabase →
#                     Project Settings → Database → Connection string (URI)
#                     Format: postgresql://postgres.[ref]:[password]@[host]:6543/postgres

on:
  push:
    branches: [main]
    paths:
      - "database/**"

jobs:
  sync-schema:
    name: Apply schema to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run schema sync
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f database/fix_schema_sync.sql
